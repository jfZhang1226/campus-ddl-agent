<svg xmlns="http://www.w3.org/2000/svg" width="414" height="850" viewBox="0 0 414 850" role="img" aria-labelledby="title desc"><title id="title">助手输入页与待确认任务卡</title><desc id="desc">D 的 T04 可编辑矢量草图，全部为合成示例，不是已实现应用截图。</desc><g font-family="Microsoft YaHei, sans-serif"><rect x="1" y="1" width="412" height="848" rx="24" fill="#fff" stroke="#d6e1d9"/><rect x="23" y="24" width="39" height="39" rx="12" fill="#23694e" stroke="#23694e"/><text x="33" y="51" font-size="20" font-weight="600" fill="#fff">课</text><text x="75" y="43" font-size="20" font-weight="600" fill="#18332d">课事清</text><text x="75" y="62" font-size="11" font-weight="400" fill="#61736d">校园里的事，慢慢理清。</text><text x="333" y="45" font-size="11" font-weight="400" fill="#61736d">设计草图</text><text x="27" y="108" font-size="15" font-weight="600" fill="#23694e">助手</text><text x="110" y="108" font-size="15" font-weight="600" fill="#61736d">任务</text><path d="M23 122H391" stroke="#dce5df"/><path d="M24 122h34" stroke="#23694e" stroke-width="3"/><text x="23" y="156" font-size="11" font-weight="600" fill="#23694e">添加一条通知</text><text x="23" y="185" font-size="20" font-weight="600" fill="#18332d">先记下来，再逐项确认。</text><text x="23" y="220" font-size="12" font-weight="400" fill="#61736d">通知原文</text><rect x="23" y="232" width="368" height="110" rx="10" fill="#f9fbf8" stroke="#dce5df"/><text x="35" y="258" font-size="13" font-weight="400" fill="#18332d">数据库：2026年11月6日18:00前提交</text><text x="35" y="281" font-size="13" font-weight="400" fill="#18332d">实验三报告PDF与源代码ZIP至学习通。</text><text x="35" y="324" font-size="11" font-weight="400" fill="#61736d">发布时间与导入时间分别保留</text><rect x="23" y="357" width="130" height="42" rx="10" fill="#fff" stroke="#dce5df"/><text x="60" y="384" font-size="13" font-weight="400" fill="#18332d">语音入口</text><rect x="163" y="357" width="228" height="42" rx="10" fill="#23694e" stroke="#23694e"/><text x="238" y="384" font-size="13" font-weight="400" fill="#fff">整理为任务</text><rect x="23" y="421" width="368" height="355" rx="10" fill="#fff" stroke="#dce5df"/><rect x="23" y="421" width="368" height="39" rx="10" fill="#e9f2eb" stroke="#cdded1"/><text x="38" y="446" font-size="13" font-weight="600" fill="#18332d">核对 1 个事项</text><text x="315" y="446" font-size="11" font-weight="400" fill="#23694e">待你确认</text><text x="38" y="486" font-size="11" font-weight="400" fill="#61736d">任务名称</text><rect x="38" y="496" width="338" height="36" rx="10" fill="#fff" stroke="#dce5df"/><text x="49" y="520" font-size="14" font-weight="400" fill="#18332d">实验三报告</text><text x="38" y="558" font-size="13" font-weight="400" fill="#18332d">课程：数据库</text><text x="38" y="589" font-size="14" font-weight="400" fill="#23694e">截止：2026-11-06 18:00</text><text x="38" y="622" font-size="12" font-weight="400" fill="#61736d">材料：报告PDF、源代码ZIP</text><text x="38" y="651" font-size="12" font-weight="400" fill="#23694e">查看原通知与依据  ›</text><text x="38" y="682" font-size="11" font-weight="400" fill="#61736d">未确认前，任务列表不会改变。</text><rect x="38" y="709" width="80" height="42" rx="10" fill="#fff" stroke="#dce5df"/><text x="64" y="736" font-size="13" font-weight="400" fill="#18332d">取消</text><rect x="128" y="709" width="248" height="42" rx="10" fill="#23694e" stroke="#23694e"/><text x="190" y="736" font-size="13" font-weight="400" fill="#fff">确认并加入列表</text><text x="24" y="824" font-size="11" font-weight="400" fill="#61736d">合成示例 · 待 A/B/C 评审 · 非实机运行结果</text></g></svg>